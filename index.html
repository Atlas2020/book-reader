<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starlight Reader</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A personal audiobook reader with chapter navigation and offline support." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css?v=pwa-4" />
  </head>
  <body data-has-book="false">
    <div class="app">
      <section class="book-status" id="bookStatus" hidden>
        <div class="book-cover" aria-hidden="true">
          <img id="bookCoverImage" alt="" hidden />
          <span id="bookCoverTitle"></span>
        </div>
        <div class="book-meta">
          <h2 id="bookTitle"></h2>
          <p id="readingPosition">选择章节开始阅读</p>
        </div>
        <div class="book-progress">
          <div class="progress-track" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="progressBar"></span>
          </div>
          <span id="progressLabel">0%</span>
        </div>
      </section>

      <section class="toolbar" aria-label="朗读控制">
        <button id="prevChapterBtn" class="secondary-control" aria-label="上一章" disabled>Previous Chapter</button>
        <button id="rewindBtn" class="secondary-control" aria-label="倒退 10 秒" disabled>Back 10s</button>
        <button id="playBtn" aria-label="播放" data-state="stopped" disabled>Play</button>
        <button id="forwardBtn" class="secondary-control" aria-label="快进 10 秒" disabled>Forward 10s</button>
        <button id="nextChapterBtn" class="secondary-control" aria-label="下一章" disabled>Next Chapter</button>
        <details class="more-controls">
          <summary aria-label="更多播放操作">更多</summary>
          <div class="more-control-options">
            <button id="pauseBtn" class="secondary-control" aria-label="暂停" disabled>Pause</button>
            <button id="stopBtn" class="secondary-control" aria-label="停止" disabled>Stop</button>
          </div>
        </details>
      </section>

      <details class="player-settings">
        <summary>播放设置</summary>
        <section class="settings-row" aria-label="播放设置">
        <div class="setting-control speed-control">
          <label for="rateInput">语速</label>
          <input id="rateInput" type="range" min="0.5" max="1.5" step="0.1" value="1" />
          <span id="rateValue">1.0x</span>
        </div>
        <div class="setting-control voice-control">
          <label for="voiceSelect">声音</label>
          <select id="voiceSelect" disabled>
            <option value="">正在加载声音…</option>
          </select>
          <button type="button" id="refreshVoicesBtn" class="tertiary-control">刷新声音</button>
          <span id="voiceHelp" class="voice-help" aria-live="polite"></span>
        </div>
        <details class="display-settings">
          <summary>阅读设置</summary>
          <div class="display-options">
            <label for="fontSizeInput">字号 <output id="fontSizeValue">18px</output></label>
            <input id="fontSizeInput" type="range" min="14" max="30" step="1" value="18" />
            <label for="lineHeightInput">行距 <output id="lineHeightValue">1.9</output></label>
            <input id="lineHeightInput" type="range" min="1.4" max="2.4" step="0.1" value="1.9" />
            <label for="contentWidthInput">正文宽度 <output id="contentWidthValue">Wide</output></label>
            <input id="contentWidthInput" type="range" min="600" max="1000" step="20" value="900" />
            <label for="themeSelect">主题</label>
            <select id="themeSelect">
              <option value="dark">夜间</option>
              <option value="light">日间</option>
              <option value="sepia">护眼</option>
            </select>
          </div>
        </details>
        </section>
      </details>

      <div class="reader-layout">
        <nav class="chapter-nav is-collapsed" id="chapterNav" aria-label="章节目录" hidden>
          <div class="chapter-nav-header">
            <h2>章节目录</h2>
            <button id="toggleChaptersBtn" class="tertiary-control" aria-expanded="false" type="button">展开全部</button>
          </div>
          <div id="chapterList" class="chapter-list"></div>
        </nav>

        <main>
          <header class="transcript-header">
            <div class="transcript-mini-cover" aria-hidden="true">
              <img id="transcriptCoverImage" alt="" hidden />
              <span id="transcriptCoverTitle"></span>
            </div>
            <div class="transcript-meta">
              <strong id="transcriptBookTitle"></strong>
              <span id="transcriptChapterTitle"></span>
            </div>
            <button id="closeTranscriptBtn" class="transcript-close" type="button" aria-label="返回播放器">×</button>
          </header>
          <div id="content" class="content" tabindex="0">
            导入一本书，开始听书。
          </div>
        </main>
      </div>

      <p id="appMessage" class="app-message" role="status" aria-live="polite"></p>

      <section class="library-bar" aria-label="书架与导入">
        <label for="librarySelect">书架</label>
        <select id="librarySelect" disabled>
          <option value="">选择图书</option>
        </select>
        <label class="upload-label">
          导入图书
          <input type="file" id="fileInput" accept=".txt,.md,.epub" />
        </label>
      </section>
    </div>

    <script src="jszip.min.js"></script>
    <script src="script.js?v=pwa-4"></script>
  </body>
</html>
